name: Keepalive

on:
  schedule:
    - cron: "0 12 1,15 * *"  # 1st and 15th of each month, 12:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Commit keepalive stamp
        run: |
          date -u +%Y-%m-%d > .github/keepalive
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/keepalive
          git commit -m "Keepalive: reset scheduled-workflow inactivity timer" || exit 0
          git push
